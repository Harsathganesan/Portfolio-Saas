# Render Blueprint Configuration for Portfolio SaaS Backend
# Runs from REPO ROOT - delegates to backend/ via root server.js
services:
  - type: web
    name: portfolio-saas-backend
    env: node
    buildCommand: npm run build:backend
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://portfolio-saas-henna.vercel.app
      - key: JWT_EXPIRE
        value: 30d
